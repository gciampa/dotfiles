# Starting config, copied to ~/.codex/config.toml only if that file is absent.
# Not symlinked: codex writes project paths into its own config.

model = "openai.gpt-5.6-sol"
model_provider = "amazon-bedrock"
approvals_reviewer = "guardian_subagent"
model_reasoning_effort = "low"

[model_providers.amazon-bedrock.aws]
# AWS_PROFILE and AWS_REGION are set from ~/.config/zsh/local.zsh.
wire_api = "responses"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "pull-request-number", "context-remaining", "used-tokens"]
status_line_use_colors = true
