# Starting config for a new machine. Copied to ~/.codex/config.toml by
# `make codex` only when that file does not already exist.
#
# Not symlinked: codex writes to its own config (project trust entries, UI
# state), and this repo is public. Keeping the live file untracked keeps
# project paths out of it.

model = "openai.gpt-5.6-sol"
model_provider = "amazon-bedrock"
approvals_reviewer = "guardian_subagent"
model_reasoning_effort = "low"

[model_providers.amazon-bedrock.aws]
profile = "oam-next-dev-admin"
region = "us-east-2"
wire_api = "responses"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "pull-request-number", "context-remaining", "used-tokens"]
status_line_use_colors = true
